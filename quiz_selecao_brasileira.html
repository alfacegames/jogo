
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  #quiz-root {
    font-family: 'Nunito', sans-serif;
    min-height: 500px;
    background: #009c3b;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
  }

  .screen { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; min-height: 500px; text-align: center; }
  .screen.active { display: flex; }

  /* ---- START ---- */
  #screen-start { background: linear-gradient(160deg, #002776 0%, #009c3b 60%, #FFDF00 100%); }
  .title-big { font-family: 'Bebas Neue', sans-serif; font-size: 52px; color: #FFDF00; letter-spacing: 2px; line-height: 1; text-shadow: 3px 3px 0 #002776; }
  .title-sub { font-size: 18px; color: #fff; font-weight: 700; margin: 8px 0 28px; opacity: 0.9; }
  .ball-emoji { font-size: 64px; margin-bottom: 12px; animation: bounce 1s infinite alternate; }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-12px); } }

  .btn-start { background: #FFDF00; color: #002776; font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 1px; border: none; padding: 14px 48px; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 0 #b89e00; transition: transform 0.1s, box-shadow 0.1s; }
  .btn-start:active { transform: translateY(3px); box-shadow: 0 1px 0 #b89e00; }

  /* ---- QUESTION ---- */
  #screen-question { background: #002776; padding: 1.5rem; justify-content: flex-start; padding-top: 2rem; }
  .hud { display: flex; justify-content: space-between; width: 100%; margin-bottom: 1.5rem; align-items: center; }
  .hud-score { background: #FFDF00; color: #002776; font-weight: 900; font-size: 15px; padding: 6px 16px; border-radius: 50px; }
  .hud-lives { font-size: 20px; letter-spacing: 4px; }
  .question-num { font-size: 13px; color: rgba(255,255,255,0.5); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
  .question-text { font-size: 20px; color: #fff; font-weight: 700; line-height: 1.4; margin-bottom: 1.5rem; min-height: 60px; }
  .options { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .opt-btn { background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2); color: #fff; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 700; padding: 14px 18px; border-radius: 12px; cursor: pointer; text-align: left; transition: background 0.15s, border 0.15s; }
  .opt-btn:hover:not(:disabled) { background: rgba(255,255,255,0.18); border-color: #FFDF00; }
  .opt-btn.correct { background: #009c3b; border-color: #00ff6a; color: #fff; }
  .opt-btn.wrong { background: #8b0000; border-color: #ff3030; color: #fff; }
  .opt-btn:disabled { cursor: default; }
  .feedback { margin-top: 1rem; font-size: 15px; font-weight: 700; min-height: 22px; }
  .feedback.ok { color: #00ff6a; }
  .feedback.fail { color: #ff5555; }

  /* ---- MOGGADO ---- */
  #screen-moggado { background: #1a0000; animation: shake-bg 0.4s; }
  @keyframes shake-bg { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  .ney-face { font-size: 96px; margin-bottom: 8px; animation: spin-face 0.5s ease; }
  @keyframes spin-face { from{transform:rotate(-20deg) scale(0.5);} to{transform:rotate(0deg) scale(1);} }
  .moggado-title { font-family: 'Bebas Neue', sans-serif; font-size: 54px; color: #ff2222; letter-spacing: 3px; text-shadow: 0 0 20px #ff0000; animation: pulse-red 1s infinite alternate; }
  @keyframes pulse-red { from{text-shadow: 0 0 10px #ff0000;} to{text-shadow: 0 0 40px #ff0000, 0 0 80px #ff3333;} }
  .moggado-sub { color: rgba(255,255,255,0.7); font-size: 16px; margin: 10px 0 6px; }
  .correct-answer { color: #FFDF00; font-size: 15px; font-weight: 700; margin-bottom: 24px; }
  .btn-retry { background: #ff2222; color: #fff; font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 1px; border: none; padding: 12px 40px; border-radius: 50px; cursor: pointer; margin-top: 8px; box-shadow: 0 4px 0 #7a0000; }

  /* ---- WIN ---- */
  #screen-win { background: linear-gradient(160deg, #002776, #009c3b); }
  .trophy { font-size: 80px; animation: bounce 0.8s infinite alternate; }
  .win-title { font-family: 'Bebas Neue', sans-serif; font-size: 48px; color: #FFDF00; letter-spacing: 2px; text-shadow: 2px 2px 0 #002776; }
  .win-score { font-size: 18px; color: #fff; margin: 10px 0 24px; font-weight: 700; }
  .btn-play-again { background: #FFDF00; color: #002776; font-family: 'Bebas Neue', sans-serif; font-size: 24px; border: none; padding: 12px 40px; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 0 #b89e00; }

  .progress-bar { width: 100%; height: 5px; background: rgba(255,255,255,0.15); border-radius: 10px; margin-bottom: 1rem; overflow: hidden; }
  .progress-fill { height: 100%; background: #FFDF00; border-radius: 10px; transition: width 0.4s; }
</style>

<div id="quiz-root">

  <div id="screen-start" class="screen active">
    <div class="ball-emoji">⚽</div>
    <div class="title-big">Quiz da<br>Seleção</div>
    <div class="title-sub">Você sabe mesmo de futebol brasileiro?<br>Cuidado com o Menino Ney! 😈</div>
    <button class="btn-start" onclick="startGame()">JOGAR AGORA</button>
  </div>

  <div id="screen-question" class="screen">
    <div class="hud">
      <div class="hud-score">⭐ <span id="score-display">0</span> pts</div>
      <div class="hud-lives" id="lives-display">❤️❤️❤️</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="question-num" id="q-num">PERGUNTA 1 / 10</div>
    <div class="question-text" id="q-text"></div>
    <div class="options" id="q-options"></div>
    <div class="feedback" id="q-feedback"></div>
  </div>

  <div id="screen-moggado" class="screen">
    <div class="ney-face">😭</div>
    <div class="moggado-title">VOCÊ FOI<br>MOGGADO!</div>
    <div class="moggado-sub">pelo Menino Ney 👦⚽</div>
    <div class="correct-answer" id="correct-answer-display"></div>
    <button class="btn-retry" onclick="startGame()">TENTAR DE NOVO</button>
  </div>

  <div id="screen-win" class="screen">
    <div class="trophy">🏆</div>
    <div class="win-title">CAMPEÃO!</div>
    <div class="win-score" id="win-score-display"></div>
    <button class="btn-play-again" onclick="startGame()">JOGAR NOVAMENTE</button>
  </div>

</div>

<script>
const ALL_QUESTIONS = [
  { q: "Quantas vezes o Brasil conquistou a Copa do Mundo FIFA?", opts: ["4 vezes","5 vezes","6 vezes","3 vezes"], a: 1 },
  { q: "Em qual ano o Brasil ganhou sua primeira Copa do Mundo?", opts: ["1950","1962","1958","1970"], a: 2 },
  { q: "Quem é o maior artilheiro da história da Seleção Brasileira?", opts: ["Ronaldo Fenômeno","Pelé","Neymar","Romário"], a: 2 },
  { q: "Qual jogador usou a famosa camisa 10 na Copa de 1970?", opts: ["Garrincha","Zico","Pelé","Rivellino"], a: 2 },
  { q: "O Brasil foi sede da Copa do Mundo em qual ano?", opts: ["2010","2018","2014","2006"], a: 2 },
  { q: "Qual foi o placar da goleada da Alemanha sobre o Brasil na semifinal da Copa de 2014?", opts: ["6x1","7x1","5x0","4x1"], a: 1 },
  { q: "Qual seleção o Brasil enfrentou na final da Copa de 1994?", opts: ["Argentina","Alemanha","Itália","França"], a: 2 },
  { q: "Quem é conhecido como 'Fenômeno' no futebol brasileiro?", opts: ["Zidane","Ronaldinho","Ronaldo R9","Adriano"], a: 2 },
  { q: "Em qual Copa do Mundo o Brasil ganhou jogando com Garrincha?", opts: ["1954","1962","1966","1970"], a: 1 },
  { q: "Qual jogador ficou famoso pelo drible chamado 'chapéu' e 'pedalada'?", opts: ["Zico","Pelé","Ronaldinho Gaúcho","Rivaldo"], a: 2 },
  { q: "Qual é a alcunha da Seleção Brasileira de futebol?", opts: ["Os Guerreiros","Canarinho","A Amarelinha","Verde e Amarelo"], a: 1 },
  { q: "Quantas Copas do Mundo o Brasil sediou?", opts: ["1","3","2","4"], a: 2 },
  { q: "Quem marcou o gol do penta do Brasil na final de 2002?", opts: ["Rivaldo","Ronaldo","Ronaldinho","Roberto Carlos"], a: 1 },
  { q: "O estádio Maracanã fica em qual cidade?", opts: ["São Paulo","Brasília","Rio de Janeiro","Belo Horizonte"], a: 2 },
  { q: "Qual técnico comandou o Brasil no tetracampeonato de 1994?", opts: ["Zagallo","Parreira","Felipão","Tite"], a: 1 },
];

let questions = [];
let currentQ = 0;
let score = 0;
let lives = 3;
let answered = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startGame() {
  questions = shuffle(ALL_QUESTIONS).slice(0, 10);
  currentQ = 0;
  score = 0;
  lives = 3;
  showScreen('screen-question');
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const total = questions.length;
  const q = questions[currentQ];
  document.getElementById('q-num').textContent = `PERGUNTA ${currentQ + 1} / ${total}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('score-display').textContent = score;
  const hearts = ['❤️','❤️','❤️'].map((h,i) => i < lives ? h : '🖤').join('');
  document.getElementById('lives-display').textContent = hearts;
  const fill = ((currentQ) / total) * 100;
  document.getElementById('progress-fill').style.width = fill + '%';
  document.getElementById('q-feedback').textContent = '';
  document.getElementById('q-feedback').className = 'feedback';

  const container = document.getElementById('q-options');
  container.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.onclick = () => answer(i);
    container.appendChild(btn);
  });
}

function answer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[currentQ];
  const btns = document.querySelectorAll('.opt-btn');
  btns.forEach(b => b.disabled = true);

  if (idx === q.a) {
    btns[idx].classList.add('correct');
    score += 100;
    document.getElementById('score-display').textContent = score;
    document.getElementById('q-feedback').textContent = '✅ Correto! +100 pts';
    document.getElementById('q-feedback').className = 'feedback ok';
    setTimeout(nextQuestion, 1100);
  } else {
    btns[idx].classList.add('wrong');
    btns[q.a].classList.add('correct');
    lives--;
    document.getElementById('q-feedback').textContent = '❌ Errou!';
    document.getElementById('q-feedback').className = 'feedback fail';
    const hearts = ['❤️','❤️','❤️'].map((h,i) => i < lives ? h : '🖤').join('');
    document.getElementById('lives-display').textContent = hearts;

    if (lives <= 0) {
      setTimeout(() => {
        document.getElementById('correct-answer-display').textContent = `A resposta certa era: "${q.opts[q.a]}"`;
        showScreen('screen-moggado');
      }, 1200);
    } else {
      setTimeout(nextQuestion, 1200);
    }
  }
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= questions.length) {
    document.getElementById('win-score-display').textContent = `Você acertou com ${score} pontos e ${lives} vida${lives !== 1 ? 's' : ''} restante${lives !== 1 ? 's' : ''}!`;
    document.getElementById('progress-fill').style.width = '100%';
    showScreen('screen-win');
  } else {
    renderQuestion();
  }
}
</script>
